<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>levyntech visiting card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f4f0e6;
        --ink: #142033;
        --teal: #0f6e62;
        --gold: #c9a227;
        --scarlet: #d6392b;
        --maroon: #6b1d2a;
        --muted: #5c6b7c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #e6e1d6;
        color: var(--ink);
        font-family: "DM Sans", "Segoe UI", sans-serif;
      }

      .studio {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 24px 64px;
      }

      .studio-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .studio-head p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: var(--teal);
        color: white;
        font: 600 14px/1 "DM Sans", "Segoe UI", sans-serif;
        padding: 12px 18px;
        cursor: pointer;
      }

      button:hover {
        background: #0c5c52;
      }

      @media (max-width: 720px) {
        .studio-head {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      .pair {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 28px 36px;
      }

      .slot {
        width: min(calc(90mm * 1.38), 100%);
        aspect-ratio: 90 / 54;
        container-type: inline-size;
        position: relative;
      }

      figure {
        margin: 0;
        width: min(calc(90mm * 1.38), 100%);
      }

      figcaption {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .card {
        width: 90mm;
        height: 54mm;
        overflow: hidden;
        position: absolute;
        top: 0;
        left: 0;
        transform: scale(calc(100cqi / 90mm));
        transform-origin: top left;
        box-shadow: 0 16px 40px rgba(20, 32, 51, 0.16);
      }

      .mark {
        display: block;
        width: 15mm;
        height: 15mm;
        flex: none;
      }

      .front {
        background: var(--cream);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 6mm 6.2mm 5.2mm 8.2mm;
      }

      .front-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4mm;
      }

      .front::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2.4mm;
        background: linear-gradient(180deg, var(--scarlet) 0%, var(--maroon) 48%, var(--gold) 100%);
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 3.4mm;
      }

      .word {
        margin: 0;
        font-size: 7.2mm;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 0.95;
        color: var(--ink);
      }

      .tag {
        margin: 1.35mm 0 0;
        font-size: 2.45mm;
        font-weight: 500;
        letter-spacing: 0.005em;
        color: var(--teal);
      }

      .services {
        display: flex;
        align-items: center;
        gap: 2.4mm;
        margin: 0;
        padding-top: 3.2mm;
        border-top: 0.2mm solid rgba(20, 32, 51, 0.14);
        font-size: 2.25mm;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .services i {
        width: 1.15mm;
        height: 1.15mm;
        border-radius: 50%;
        background: var(--gold);
        display: block;
      }

      .place {
        margin: 0;
        font-size: 2.3mm;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6d5b2e;
        flex: none;
      }

      .back {
        background: var(--ink);
        color: var(--cream);
        display: grid;
        grid-template-columns: 1fr 24mm;
        grid-template-rows: auto auto 1fr auto;
        column-gap: 4mm;
        padding: 5.2mm 5.4mm 4.6mm 6mm;
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 2.2mm;
        grid-column: 1;
        grid-row: 1;
      }

      .mark-plate {
        width: 8.2mm;
        height: 8.2mm;
        border-radius: 1.4mm;
        background: var(--cream);
        display: grid;
        place-items: center;
        flex: none;
      }

      .mark-plate .mark {
        width: 6.6mm;
        height: 6.6mm;
      }

      .brand-name {
        margin: 0;
        font-size: 3.7mm;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .phone-block {
        grid-column: 1;
        grid-row: 2;
        align-self: end;
        padding-top: 3.2mm;
      }

      .kicker {
        margin: 0;
        font-size: 2.05mm;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .phone {
        margin: 0.7mm 0 0;
        font-size: 5.15mm;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .meta {
        grid-column: 1;
        grid-row: 3;
        align-self: end;
        padding-bottom: 2.4mm;
      }

      .email {
        margin: 0;
        font-size: 2.85mm;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #f3ecdf;
      }

      .city {
        margin: 0.9mm 0 0;
        font-size: 2.45mm;
        color: #b7c0cc;
      }

      .qr {
        grid-column: 2;
        grid-row: 1 / span 3;
        align-self: center;
        justify-self: end;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 22mm;
      }

      .qr img {
        width: 22mm;
        height: 22mm;
        display: block;
        background: white;
        padding: 1.6mm;
        border-radius: 1.3mm;
        box-sizing: border-box;
      }

      .qr span {
        display: block;
        margin-top: 1.1mm;
        font-size: 1.9mm;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .back-services {
        grid-column: 1 / -1;
        grid-row: 4;
        margin: 0;
        padding-top: 2.3mm;
        border-top: 0.25mm solid rgba(201, 162, 39, 0.55);
        font-size: 2.15mm;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d9deE6;
      }

      .note {
        margin-top: 36px;
        max-width: 640px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      @media print {
        @page {
          size: 90mm 54mm;
          margin: 0;
        }

        html,
        body {
          background: white;
        }

        .studio {
          max-width: none;
          margin: 0;
          padding: 0;
        }

        .studio-head,
        figcaption,
        .note {
          display: none;
        }

        figure {
          width: 90mm;
        }

        .pair {
          display: block;
        }

        .slot {
          width: 90mm;
          height: 54mm;
          aspect-ratio: auto;
          container-type: normal;
          break-after: page;
          page-break-after: always;
        }

        .card {
          position: relative;
          transform: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="studio">
      <header class="studio-head">
        <div>
          <h1>levyntech visiting card</h1>
          <p>Front and back · 90 × 54 mm · shown larger on screen</p>
        </div>
        <button type="button" onclick="window.print()">Print or save PDF</button>
      </header>

      <div class="pair">
        <figure>
          <div class="slot">
          <article class="card front" aria-label="Visiting card front">
            <div class="front-main">
            <div class="lockup">
              <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <mask id="front-mark">
                    <rect width="100" height="100" fill="white" />
                    <path d="M44 52 H66 V66 H74 V78 H44 Z" fill="black" />
                    <path d="M56 52 H34 V66 H26 V78 H56 Z" fill="black" />
                  </mask>
                </defs>
                <path d="M50 12 L88 82 H12 Z" fill="#6B1D2A" mask="url(#front-mark)" />
                <path d="M44 52 H66 V66 H74 V78 H44 Z" fill="#D6392B" />
                <path d="M56 52 H34 V66 H26 V78 H56 Z" fill="#C9A227" />
                <path d="M50 12 L88 82 H12 Z" fill="none" stroke="#D6392B" stroke-width="3.5" stroke-linejoin="round" />
              </svg>
              <div>
                <p class="word">levyntech</p>
                <p class="tag">Leverage · Innovation · Technology</p>
              </div>
            </div>
              <p class="place">Chennai</p>
            </div>
            <p class="services">
              <span>Software</span>
              <i></i>
              <span>Websites</span>
              <i></i>
              <span>Local SEO</span>
            </p>
          </article>
          </div>
          <figcaption>Front</figcaption>
        </figure>

        <figure>
          <div class="slot">
          <article class="card back" aria-label="Visiting card back">
            <div class="brand-row">
              <span class="mark-plate">
                <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                  <defs>
                    <mask id="back-mark">
                      <rect width="100" height="100" fill="white" />
                      <path d="M44 52 H66 V66 H74 V78 H44 Z" fill="black" />
                      <path d="M56 52 H34 V66 H26 V78 H56 Z" fill="black" />
                    </mask>
                  </defs>
                  <path d="M50 12 L88 82 H12 Z" fill="#6B1D2A" mask="url(#back-mark)" />
                  <path d="M44 52 H66 V66 H74 V78 H44 Z" fill="#D6392B" />
                  <path d="M56 52 H34 V66 H26 V78 H56 Z" fill="#C9A227" />
                  <path d="M50 12 L88 82 H12 Z" fill="none" stroke="#D6392B" stroke-width="3.5" stroke-linejoin="round" />
                </svg>
              </span>
              <p class="brand-name">levyntech</p>
            </div>
            <div class="phone-block">
              <p class="kicker">Call · WhatsApp</p>
              <p class="phone">+91 63834 70063</p>
            </div>
            <div class="meta">
              <p class="email">iamlogeshwaran.info@gmail.com</p>
              <p class="city">Chennai, Tamil Nadu</p>
            </div>
            <div class="qr">
              <img src="whatsapp-qr.svg" alt="QR code that opens WhatsApp chat" />
              <span>Scan</span>
            </div>
            <p class="back-services">Software · Websites · Local SEO</p>
          </article>
          </div>
          <figcaption>Back</figcaption>
        </figure>
      </div>

      <p class="note">
        Print at 100% scale with margins set to none. Choose double-sided and flip on the short edge so the front and back line up. The QR code opens a WhatsApp chat to the same number.
      </p>
    </main>
  </body>
</html>
